<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pete's Dragon 3D TPU Armor Plate Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<style>
  :root {
    --bg: #070a0f;
    --card: rgba(18, 24, 32, 0.85);
    --border: #1e293b;
    --accent: #00ff88;
    --cyan: #00e5ff;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #canvas-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* Floating Header */
  .header-bar {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .title-box {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 18px;
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .title-box h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
    color: #fff;
  }
  .badge-stl { background: #0284c7; }
  .badge-led { background: #059669; }

  /* Floating Control Bar */
  .control-bar {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 10;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    flex-wrap: wrap;
    justify-content: center;
    max-width: 95vw;
  }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0b0f17;
    padding: 4px;
    border-radius: 8px;
    border: 1px solid #1e293b;
  }

  .btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover {
    color: #fff;
    background: rgba(255,255,255,0.06);
  }
  .btn.active {
    background: var(--cyan);
    color: #040810;
    font-weight: 700;
  }
  .btn.active-green {
    background: var(--accent);
    color: #040810;
    font-weight: 700;
  }

  .divider {
    width: 1px;
    height: 24px;
    background: var(--border);
  }

  .slider-control {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .slider-control input[type="range"] {
    width: 110px;
    accent-color: var(--cyan);
    cursor: pointer;
  }

  /* Status Indicator */
  .status-pill {
    position: absolute;
    top: 76px;
    left: 20px;
    background: rgba(11, 15, 23, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 10;
    pointer-events: none;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* Loading Spinner */
  #loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 100;
    transition: opacity 0.4s ease;
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #1e293b;
    border-top: 4px solid var(--cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div style="font-size:14px; font-weight:600; color:var(--cyan);">Loading 3D STL Model & Graphic Cutouts...</div>
</div>

<div class="header-bar">
  <div class="title-box">
    <h1>🐉 Pete's Dragon TPU Armor Plate</h1>
    <span class="badge badge-stl">3.1 MB STL Mesh</span>
    <span class="badge badge-led">100 Cutout Windows (2×2mm)</span>
  </div>
</div>

<div class="status-pill" id="status-pill">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-text">LEDs: Static Pete's Dragon Colors</span>
</div>

<div class="control-bar">
  <!-- View Controls -->
  <div class="btn-group">
    <button class="btn active" id="btn-front" onclick="setView('front')">👕 Front Face</button>
    <button class="btn" id="btn-back" onclick="setView('back')">🔄 Underside (Pockets)</button>
    <button class="btn" id="btn-iso" onclick="setView('iso')">📐 3D Angle</button>
  </div>

  <div class="divider"></div>

  <!-- LED Simulation Modes -->
  <div class="btn-group">
    <button class="btn" id="btn-led-off" onclick="setLedMode('off')">⚫ LEDs Off</button>
    <button class="btn active-green" id="btn-led-on" onclick="setLedMode('on')">💡 Static On</button>
    <button class="btn" id="btn-led-anim" onclick="setLedMode('animate')">✨ Animated Parade</button>
  </div>

  <div class="divider"></div>

  <!-- Graphic Opacity Slider -->
  <div class="slider-control">
    <span>🎨 Graphic:</span>
    <input type="range" id="art-slider" min="0" max="100" value="95" oninput="onArtOpacityChange(this.value)">
    <span id="art-num" style="color:var(--cyan); width:32px;">95%</span>
  </div>

  <div class="divider"></div>

  <!-- TPU Plate Color / Wireframe -->
  <div class="slider-control">
    <span>🛡️ Armor:</span>
    <input type="range" id="plate-slider" min="0" max="100" value="100" oninput="onPlateOpacityChange(this.value)">
    <span id="plate-num" style="color:var(--cyan); width:32px;">100%</span>
  </div>
</div>

<div id="canvas-container"></div>

<script>
let scene, camera, renderer, controls;
let stlMesh, graphicMesh, ledsGroup;
let ledMode = 'on'; // 'off', 'on', 'animate'
let animClock = 0;
let specsData = null;
let ledMaterials = [];
let baseColors = [];

// CAD & Image dimensions
const IMG_WIDTH_MM = 185.0;
const IMG_HEIGHT_MM = 222.09;
// STL bounding box center in mm space
const STL_CENTER_X = 87.846;
const STL_CENTER_Y = 108.536;
const STL_CENTER_Z = 3.0;

function init() {
  const container = document.getElementById('canvas-container');
  const w = window.innerWidth;
  const h = window.innerHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a0f);

  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 2000);
  camera.position.set(0, 0, 320); // Looking at front face

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxDistance = 800;
  controls.minDistance = 60;

  // Studio Lighting
  const ambLight = new THREE.AmbientLight(0xffffff, 0.75);
  scene.add(ambLight);

  const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
  keyLight.position.set(80, 120, 200);
  scene.add(keyLight);

  const backLight = new THREE.DirectionalLight(0x38bdf8, 0.7);
  backLight.position.set(-100, -100, -200);
  scene.add(backLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
  fillLight.position.set(0, -150, 100);
  scene.add(fillLight);

  window.addEventListener('resize', onWindowResize);

  loadDataAndBuild();
}

async function loadDataAndBuild() {
  try {
    // 1. Fetch Specs
    const resp = await fetch('petes_dragon_specs.json');
    specsData = await resp.json();

    // 2. Load 3D Binary STL Model
    const stlLoader = new THREE.STLLoader();
    const geom = await new Promise((resolve, reject) => {
      stlLoader.load('petes_dragon_tpu_panel.stl', resolve, undefined, reject);
    });

    geom.computeVertexNormals();

    // TPU Flexible Resin Material (Dark charcoal slate)
    const stlMat = new THREE.MeshStandardMaterial({
      color: 0x1a2230,
      roughness: 0.55,
      metalness: 0.15,
      side: THREE.DoubleSide
    });

    stlMesh = new THREE.Mesh(geom, stlMat);
    // Center mesh at origin:
    stlMesh.position.set(-STL_CENTER_X, -STL_CENTER_Y, -STL_CENTER_Z);
    scene.add(stlMesh);

    // 3. Create Graphic Overlay with 2mm x 2mm Window Cutouts
    await createCutoutGraphicMesh();

    // 4. Create 100 LED Pixels behind the 2x2mm windows
    createLedPixels();

    // Hide loader
    const overlay = document.getElementById('loading-overlay');
    overlay.style.opacity = '0';
    setTimeout(() => overlay.style.display = 'none', 400);

    animate();
  } catch (err) {
    console.error("Initialization error:", err);
    document.getElementById('loading-overlay').innerHTML = `
      <div style="color:#ef4444; font-weight:700;">Error Loading 3D Preview: ${err.message}</div>
    `;
  }
}

async function createCutoutGraphicMesh() {
  // Load the authentic Pete's Dragon transparent image
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = '/assets/petes_dragon_transparent.png';

  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
  });

  const imgW = img.width;
  const imgH = img.height;

  // Create an offscreen HTML5 canvas to physically punch holes
  const canvas = document.createElement('canvas');
  canvas.width = imgW;
  canvas.height = imgH;
  const ctx = canvas.getContext('2d');

  // Draw full image
  ctx.drawImage(img, 0, 0);

  // Set composite mode to cut out clean transparent holes
  ctx.globalCompositeOperation = 'destination-out';

  // 2.0mm x 2.0mm window aperture half-widths in pixels
  const hwPx = (1.0 / IMG_WIDTH_MM) * imgW;
  const hhPx = (1.0 / IMG_HEIGHT_MM) * imgH;

  const leds = specsData.ordered_leds || [];
  leds.forEach(l => {
    // In CAD: lx in [0, IMG_WIDTH_MM], ly in [0, IMG_HEIGHT_MM] (Y=0 is bottom)
    const px = (l.x / IMG_WIDTH_MM) * imgW;
    const py = (1.0 - (l.y / IMG_HEIGHT_MM)) * imgH;

    // Punch out the 2mm x 2mm square window
    ctx.fillRect(px - hwPx, py - hhPx, hwPx * 2, hhPx * 2);
  });

  // Reset composite mode
  ctx.globalCompositeOperation = 'source-over';

  // Generate Three.js Texture from Canvas
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;

  const artGeom = new THREE.PlaneGeometry(IMG_WIDTH_MM, IMG_HEIGHT_MM);
  const artMat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    opacity: 0.95,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  graphicMesh = new THREE.Mesh(artGeom, artMat);
  // Position directly on the front face (Z = 0 in STL space, which is Z = -STL_CENTER_Z + 0.05 mm)
  // Shifted so pixel (0, 0) matches CAD (0, 0)
  graphicMesh.position.set(
    (IMG_WIDTH_MM / 2.0) - STL_CENTER_X,
    (IMG_HEIGHT_MM / 2.0) - STL_CENTER_Y,
    -STL_CENTER_Z + 0.08
  );
  scene.add(graphicMesh);
}

function createLedPixels() {
  ledsGroup = new THREE.Group();
  const leds = specsData.ordered_leds || [];

  // 1.8mm square emissive pixel sitting right in the 2x2mm window (Z = 0.5mm floor)
  const pixelGeom = new THREE.PlaneGeometry(1.8, 1.8);

  leds.forEach((l, idx) => {
    const c = l.color || { r: 0, g: 255, b: 100 };
    baseColors.push(new THREE.Color(c.r / 255, c.g / 255, c.b / 255));

    const mat = new THREE.MeshBasicMaterial({
      color: baseColors[idx].clone(),
      side: THREE.DoubleSide
    });
    ledMaterials.push(mat);

    const pixelMesh = new THREE.Mesh(pixelGeom, mat);
    // Position at LED CAD coordinates, slightly recessed inside the 2x2mm aperture
    pixelMesh.position.set(
      l.x - STL_CENTER_X,
      l.y - STL_CENTER_Y,
      -STL_CENTER_Z + 0.02
    );
    ledsGroup.add(pixelMesh);
  });

  scene.add(ledsGroup);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (ledMode === 'animate' && ledsGroup) {
    animClock += 0.035;
    const num = ledMaterials.length;

    for (let i = 0; i < num; i++) {
      // Traveling wave shimmer
      const wave = (Math.sin(animClock * 4 - i * 0.15) + 1.0) / 2.0;
      const sparkle = (Math.sin(animClock * 9 + i * 3.7) > 0.85) ? 1.5 : 1.0;
      const factor = (0.2 + 0.8 * wave) * sparkle;

      const base = baseColors[i];
      ledMaterials[i].color.setRGB(
        Math.min(1.0, base.r * factor),
        Math.min(1.0, base.g * factor),
        Math.min(1.0, base.b * factor)
      );
    }
  }

  renderer.render(scene, camera);
}

function setView(view) {
  document.querySelectorAll('.btn-group #btn-front, .btn-group #btn-back, .btn-group #btn-iso').forEach(b => b.classList.remove('active'));

  if (view === 'front') {
    document.getElementById('btn-front').classList.add('active');
    camera.position.set(0, 0, 320);
    controls.target.set(0, 0, 0);
  } else if (view === 'back') {
    document.getElementById('btn-back').classList.add('active');
    camera.position.set(0, 0, -320);
    controls.target.set(0, 0, 0);
  } else if (view === 'iso') {
    document.getElementById('btn-iso').classList.add('active');
    camera.position.set(160, -140, 220);
    controls.target.set(0, 0, 0);
  }
}

function setLedMode(mode) {
  ledMode = mode;
  document.getElementById('btn-led-off').classList.remove('active-green', 'active');
  document.getElementById('btn-led-on').classList.remove('active-green', 'active');
  document.getElementById('btn-led-anim').classList.remove('active-green', 'active');

  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  if (mode === 'off') {
    document.getElementById('btn-led-off').classList.add('active');
    statusDot.style.background = '#64748b';
    statusDot.style.boxShadow = 'none';
    statusText.textContent = 'LEDs: All Pixels Switched Off';

    ledMaterials.forEach(m => m.color.setRGB(0.08, 0.08, 0.08));
  } else if (mode === 'on') {
    document.getElementById('btn-led-on').classList.add('active-green');
    statusDot.style.background = '#00ff88';
    statusDot.style.boxShadow = '0 0 8px #00ff88';
    statusText.textContent = "LEDs: Static Pete's Dragon Colors";

    ledMaterials.forEach((m, idx) => m.color.copy(baseColors[idx]));
  } else if (mode === 'animate') {
    document.getElementById('btn-led-anim').classList.add('active-green');
    statusDot.style.background = '#00e5ff';
    statusDot.style.boxShadow = '0 0 8px #00e5ff';
    statusText.textContent = 'LEDs: 60 FPS Parade Shimmer / Wave Active';
  }
}

function onArtOpacityChange(val) {
  const op = val / 100.0;
  document.getElementById('art-num').textContent = val + '%';
  if (graphicMesh) {
    graphicMesh.material.opacity = op;
    graphicMesh.visible = (val > 0);
  }
}

function onPlateOpacityChange(val) {
  const op = val / 100.0;
  document.getElementById('plate-num').textContent = val + '%';
  if (stlMesh) {
    stlMesh.material.opacity = op;
    stlMesh.material.transparent = (val < 100);
    stlMesh.visible = (val > 0);
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>

</body>
</html>
