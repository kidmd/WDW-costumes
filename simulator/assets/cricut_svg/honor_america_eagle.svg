<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Main Street Electrical Parade - Float 07: To Honor America (Flag & Eagle) -->
  <!-- Designed for Layered Cricut Heat Transfer Vinyl (HTV) Cutting -->

  <defs>
    <style>
      .layer-blue { fill: #3a86ff; }
      .layer-red { fill: #e63946; }
      .layer-gold { fill: #ffb703; }
      .layer-white { fill: #ffffff; }
      .stroke-dark { stroke: #111111; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- LAYER 1: PATRIOTIC BLUE HTV (Flag Starfield Canton & Eagle Wings/Body Base) -->
  <g id="Layer_1_Blue_Vinyl" class="layer-blue">
    <!-- Eagle Body Silhouette & Feathered Wingspan -->
    <!-- Left Wing -->
    <path class="stroke-dark" d="M 400 240 C 350 200 260 140 140 160 C 110 165 90 190 120 210 C 160 230 200 240 240 250 C 180 270 140 290 150 310 C 170 330 230 310 280 290 C 220 320 180 350 200 370 C 220 390 280 350 330 320 C 320 360 340 380 370 360 C 390 340 400 290 400 240 Z" />

    <!-- Right Wing -->
    <path class="stroke-dark" d="M 400 240 C 450 200 540 140 660 160 C 690 165 710 190 680 210 C 640 230 600 240 560 250 C 620 270 660 290 650 310 C 630 330 570 310 520 290 C 580 320 620 350 600 370 C 580 390 520 350 470 320 C 480 360 460 380 430 360 C 410 340 400 290 400 240 Z" />

    <!-- Flag Blue Canton (Starfield) -->
    <path class="stroke-dark" d="M 220 380 C 290 360 360 380 410 400 L 410 470 C 360 450 290 440 220 455 Z" />

    <!-- Banner Ribbon Scroll Ends -->
    <path class="stroke-dark" d="M 120 500 L 170 480 L 170 540 L 120 530 Z" />
    <path class="stroke-dark" d="M 680 500 L 630 480 L 630 540 L 680 530 Z" />
  </g>

  <!-- LAYER 2: CRIMSON RED HTV (Waving Flag Stripes & Firework Radiance) -->
  <g id="Layer_2_Red_Vinyl" class="layer-red">
    <!-- Waving Flag Red Stripes (Alternating under eagle) -->
    <!-- Red Stripe 1 (Top) -->
    <path class="stroke-dark" d="M 410 400 C 470 420 530 410 610 380 L 610 398 C 530 428 470 438 410 418 Z" />
    <!-- Red Stripe 2 -->
    <path class="stroke-dark" d="M 410 436 C 470 456 530 446 610 416 L 610 434 C 530 464 470 474 410 454 Z" />
    <!-- Red Stripe 3 (Full Width Across Bottom) -->
    <path class="stroke-dark" d="M 220 473 C 350 445 470 492 610 452 L 610 470 C 470 510 350 465 220 491 Z" />
    <!-- Red Stripe 4 (Base) -->
    <path class="stroke-dark" d="M 220 509 C 350 485 470 528 610 488 L 610 506 C 470 546 350 505 220 527 Z" />

    <!-- Grand Finale Firework Starburst Rays -->
    <!-- Center Top Starburst Rays -->
    <line x1="400" y1="50" x2="400" y2="10" stroke="#e63946" stroke-width="8" stroke-linecap="round" />
    <line x1="428" y1="62" x2="456" y2="34" stroke="#e63946" stroke-width="8" stroke-linecap="round" />
    <line x1="372" y1="62" x2="344" y2="34" stroke="#e63946" stroke-width="8" stroke-linecap="round" />

    <!-- Left Flank Firework Rays -->
    <line x1="160" y1="110" x2="130" y2="80" stroke="#e63946" stroke-width="6" stroke-linecap="round" />
    <line x1="160" y1="110" x2="180" y2="70" stroke="#e63946" stroke-width="6" stroke-linecap="round" />

    <!-- Right Flank Firework Rays -->
    <line x1="640" y1="110" x2="670" y2="80" stroke="#e63946" stroke-width="6" stroke-linecap="round" />
    <line x1="640" y1="110" x2="620" y2="70" stroke="#e63946" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- LAYER 3: WARM GOLD HTV (Eagle Beak, Talons, Starburst Centers, Banner Trim) -->
  <g id="Layer_3_Gold_Vinyl" class="layer-gold">
    <!-- Curved Eagle Beak -->
    <path class="stroke-dark" d="M 370 185 C 340 185 330 205 340 220 C 350 215 365 210 380 205 Z" />

    <!-- Fierce Eagle Eye Iris -->
    <circle cx="395" cy="182" r="7" class="stroke-dark" />

    <!-- Golden Eagle Talons (Gripping Banner Ribbon) -->
    <path class="stroke-dark" d="M 350 360 C 345 385 360 395 375 390 C 370 375 365 360 350 360 Z" />
    <path class="stroke-dark" d="M 450 360 C 455 385 440 395 425 390 C 430 375 435 360 450 360 Z" />

    <!-- Patriotic Grand Banner Ribbon Body -->
    <path class="stroke-dark" d="M 160 480 C 320 460 480 460 640 480 L 630 540 C 480 520 320 520 170 540 Z" />

    <!-- Firework Center Burst Discs -->
    <circle cx="400" cy="70" r="14" class="stroke-dark" />
    <circle cx="160" cy="110" r="10" class="stroke-dark" />
    <circle cx="640" cy="110" r="10" class="stroke-dark" />
  </g>

  <!-- LAYER 4: CRISP WHITE HTV (Bald Eagle Head, Tail Feathers, Stars, Banner Letters) -->
  <g id="Layer_4_White_Vinyl" class="layer-white">
    <!-- Majestic Bald Eagle Head Feathers -->
    <path class="stroke-dark" d="M 400 150 C 370 150 355 170 370 195 C 380 195 385 205 385 215 C 375 225 370 245 400 245 C 415 245 425 235 425 215 C 435 195 430 170 415 155 C 410 150 405 150 400 150 Z" />

    <!-- Eagle Fan Tail Feathers -->
    <path class="stroke-dark" d="M 370 340 L 350 410 C 380 425 420 425 450 410 L 430 340 Z" />
    <line x1="390" y1="350" x2="385" y2="415" stroke="#111111" stroke-width="3" />
    <line x1="410" y1="350" x2="415" y2="415" stroke="#111111" stroke-width="3" />

    <!-- Waving Flag White Stripes -->
    <path class="stroke-dark" d="M 410 418 C 470 438 530 428 610 398 L 610 416 C 530 446 470 456 410 436 Z" />
    <path class="stroke-dark" d="M 410 454 C 470 474 530 464 610 434 L 610 452 C 530 482 470 492 410 472 Z" />
    <path class="stroke-dark" d="M 220 491 C 350 465 470 510 610 470 L 610 488 C 470 528 350 485 220 509 Z" />

    <!-- 5-Pointed Stars on Blue Field -->
    <!-- Star 1 -->
    <polygon points="260,390 263,398 271,399 265,404 267,412 260,407 253,412 255,404 249,399 257,398" />
    <!-- Star 2 -->
    <polygon points="310,395 313,403 321,404 315,409 317,417 310,412 303,417 305,409 299,404 307,403" />
    <!-- Star 3 -->
    <polygon points="360,405 363,413 371,414 365,419 367,427 360,422 353,427 355,419 349,414 357,413" />
    <!-- Star 4 -->
    <polygon points="280,430 283,438 291,439 285,444 287,452 280,447 273,452 275,444 269,439 277,438" />
    <!-- Star 5 -->
    <polygon points="330,435 333,443 341,444 335,449 337,457 330,452 323,457 325,449 319,444 327,443" />

    <!-- "TO HONOR AMERICA" Text on Gold Ribbon -->
    <text x="400" y="520" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="4" font-weight="bold" text-anchor="middle" fill="#ffffff" stroke="#111111" stroke-width="2">TO HONOR AMERICA</text>

    <!-- Star Sparkles along Eagle Wings (For LEDs!) -->
    <circle cx="160" cy="180" r="7" />
    <circle cx="230" cy="185" r="7" />
    <circle cx="300" cy="205" r="7" />
    <circle cx="640" cy="180" r="7" />
    <circle cx="570" cy="185" r="7" />
    <circle cx="500" cy="205" r="7" />
  </g>
</svg>
