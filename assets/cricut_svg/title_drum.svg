<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Main Street Electrical Parade - Float 02: The Title Drum -->
  <!-- Designed for Layered Cricut Heat Transfer Vinyl (HTV) Cutting -->

  <defs>
    <style>
      .layer-gold { fill: #ffb703; }
      .layer-blue { fill: #1d3557; }
      .layer-cyan { fill: #48cae4; }
      .layer-white { fill: #ffffff; }
      .stroke-dark { stroke: #111111; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- LAYER 1: DEEP BLUE / NAVY HTV (Drum Face & Backdrop) -->
  <g id="Layer_1_Blue_Vinyl" class="layer-blue">
    <!-- Drum Head Circle Face -->
    <circle cx="400" cy="280" r="195" class="stroke-dark" />
  </g>

  <!-- LAYER 2: GOLD HTV (Chaser Marquee Ring, Filigree Frame, Wagon Wheels) -->
  <g id="Layer_2_Gold_Vinyl" class="layer-gold">
    <!-- Outer Marquee Border Ring -->
    <path class="stroke-dark" fill-rule="evenodd" d="M 400 65 A 215 215 0 1 0 400 495 A 215 215 0 1 0 400 65 Z M 400 95 A 185 185 0 1 1 400 465 A 185 185 0 1 1 400 95 Z" />
    
    <!-- Drum Shell Tension Brackets (Top & Sides) -->
    <rect x="388" y="50" width="24" height="25" rx="4" class="stroke-dark" />
    <rect x="388" y="485" width="24" height="25" rx="4" class="stroke-dark" />
    <rect x="170" y="268" width="25" height="24" rx="4" class="stroke-dark" />
    <rect x="605" y="268" width="25" height="24" rx="4" class="stroke-dark" />

    <!-- Ornate Golden Scrolling Carriage Frame Base -->
    <path class="stroke-dark" d="M 230 460 C 270 480 320 490 400 490 C 480 490 530 480 570 460 C 600 480 620 515 580 530 C 510 520 480 520 400 520 C 320 520 290 520 220 530 C 180 515 200 480 230 460 Z" />
    <circle cx="215" cy="515" r="14" class="stroke-dark" />
    <circle cx="585" cy="515" r="14" class="stroke-dark" />

    <!-- Left Wagon Cart Wheel -->
    <circle cx="250" cy="535" r="45" fill="none" stroke="#ffb703" stroke-width="12" />
    <circle cx="250" cy="535" r="45" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="250" cy="535" r="14" class="stroke-dark" />
    <line x1="250" y1="490" x2="250" y2="580" stroke="#ffb703" stroke-width="6" />
    <line x1="205" y1="535" x2="295" y2="535" stroke="#ffb703" stroke-width="6" />

    <!-- Right Wagon Cart Wheel -->
    <circle cx="550" cy="535" r="45" fill="none" stroke="#ffb703" stroke-width="12" />
    <circle cx="550" cy="535" r="45" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="550" cy="535" r="14" class="stroke-dark" />
    <line x1="550" y1="490" x2="550" y2="580" stroke="#ffb703" stroke-width="6" />
    <line x1="505" y1="535" x2="595" y2="535" stroke="#ffb703" stroke-width="6" />

    <!-- Decorative Corner Scroll Filigree (Top Left & Top Right) -->
    <path class="stroke-dark" d="M 230 140 C 210 110 240 80 270 95 C 255 105 245 125 250 145 Z" />
    <path class="stroke-dark" d="M 570 140 C 590 110 560 80 530 95 C 545 105 555 125 550 145 Z" />
  </g>

  <!-- LAYER 3: ELECTRIC CYAN HTV (Banner Accents & Ribbon Flourishes) -->
  <g id="Layer_3_Cyan_Vinyl" class="layer-cyan">
    <!-- Arched Upper Ribbon Banner -->
    <path class="stroke-dark" d="M 250 200 C 320 165 480 165 550 200 C 530 220 470 190 400 190 C 330 190 270 220 250 200 Z" />
    <!-- Lower Curved Banner -->
    <path class="stroke-dark" d="M 240 375 C 320 410 480 410 560 375 C 545 395 480 430 400 430 C 320 430 255 395 240 375 Z" />
    <!-- Sparkle Diamonds -->
    <polygon points="400,120 408,135 423,143 408,151 400,166 392,151 377,143 392,135" />
    <polygon points="260,270 265,280 275,285 265,290 260,300 255,290 245,285 255,280" />
    <polygon points="540,270 545,280 555,285 545,290 540,300 535,290 525,285 535,280" />
  </g>

  <!-- LAYER 4: CRISP WHITE / GLOW WHITE HTV (Bulb Dots, Script, & Block Lettering) -->
  <g id="Layer_4_White_Vinyl" class="layer-white">
    <!-- Marquee Ring Bulb Dots (Outer Chaser Lights) -->
    <!-- Circular pattern of discrete light bulbs around the drum rim -->
    <circle cx="400" cy="80" r="9" />
    <circle cx="454" cy="87" r="9" />
    <circle cx="505" cy="108" r="9" />
    <circle cx="549" cy="141" r="9" />
    <circle cx="581" cy="184" r="9" />
    <circle cx="598" cy="235" r="9" />
    <circle cx="600" cy="280" r="9" />
    <circle cx="598" cy="325" r="9" />
    <circle cx="581" cy="376" r="9" />
    <circle cx="549" cy="419" r="9" />
    <circle cx="505" cy="452" r="9" />
    <circle cx="454" cy="473" r="9" />
    <circle cx="400" cy="480" r="9" />
    <circle cx="346" cy="473" r="9" />
    <circle cx="295" cy="452" r="9" />
    <circle cx="251" cy="419" r="9" />
    <circle cx="219" cy="376" r="9" />
    <circle cx="202" cy="325" r="9" />
    <circle cx="200" cy="280" r="9" />
    <circle cx="202" cy="235" r="9" />
    <circle cx="219" cy="184" r="9" />
    <circle cx="251" cy="141" r="9" />
    <circle cx="295" cy="108" r="9" />
    <circle cx="346" cy="87" r="9" />

    <!-- "Disney PRESENTS" Upper Script/Text -->
    <text x="400" y="222" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="34" font-weight="bold" font-style="italic" text-anchor="middle" fill="#ffffff">Disneyland</text>
    <text x="400" y="246" font-family="'Arial Black', sans-serif" font-size="16" letter-spacing="4" font-weight="bold" text-anchor="middle" fill="#ffb703">PRESENTS</text>

    <!-- "MAIN STREET" Arched Text -->
    <text x="400" y="292" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" letter-spacing="5" font-weight="bold" text-anchor="middle" fill="#ffffff" stroke="#111111" stroke-width="2">MAIN STREET</text>

    <!-- "ELECTRICAL PARADE" Centerpiece Bold Font -->
    <text x="400" y="342" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" letter-spacing="3" font-weight="bold" text-anchor="middle" fill="#ffb703" stroke="#111111" stroke-width="2.5">ELECTRICAL</text>
    <text x="400" y="386" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" letter-spacing="6" font-weight="bold" text-anchor="middle" fill="#ffffff" stroke="#111111" stroke-width="2">PARADE</text>
  </g>
</svg>
