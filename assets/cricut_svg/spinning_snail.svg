<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Main Street Electrical Parade - Float 04: The Spinning Snail -->
  <!-- Designed for Layered Cricut Heat Transfer Vinyl (HTV) Cutting -->

  <defs>
    <style>
      .layer-pink { fill: #ff007f; }
      .layer-yellow { fill: #ffb703; }
      .layer-cyan { fill: #48cae4; }
      .layer-white { fill: #ffffff; }
      .stroke-dark { stroke: #111111; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- LAYER 1: SUNNY YELLOW HTV (Snail Body & Primary Spiral Core) -->
  <g id="Layer_1_Yellow_Vinyl" class="layer-yellow">
    <!-- Friendly Snail Head & Neck Rising Left -->
    <path class="stroke-dark" d="M 230 460 C 200 440 180 380 190 320 C 195 280 230 260 270 280 C 290 290 300 320 300 350 L 320 460 Z" />

    <!-- Snail Waving Foot / Lower Body Base -->
    <path class="stroke-dark" d="M 160 480 C 120 480 110 500 130 520 C 170 545 270 535 380 535 C 500 535 620 545 680 520 C 710 500 690 480 650 480 C 580 470 420 470 250 470 Z" />

    <!-- Big Center Spiral Shell Disc -->
    <circle cx="470" cy="310" r="185" class="stroke-dark" />
  </g>

  <!-- LAYER 2: NEON PINK / MAGENTA HTV (Iconic Whirling Spiral Shell Pattern) -->
  <g id="Layer_2_Pink_Vinyl" class="layer-pink">
    <!-- Giant Multi-Color Spinning Spiral Bands (The Parade Wheel Lights) -->
    <!-- Spiral Arm 1 -->
    <path class="stroke-dark" d="M 470 310 C 470 270 510 270 510 310 C 510 370 430 370 430 310 C 430 210 570 210 570 310 C 570 430 370 430 370 310 C 370 150 630 150 630 310 C 630 490 310 490 310 310 C 310 90 690 90 690 310" fill="none" stroke="#ff007f" stroke-width="24" stroke-linecap="round" />

    <!-- Rosy Cheek Blush -->
    <circle cx="215" cy="355" r="16" />

    <!-- Smiling Mouth Tongue Accent -->
    <path class="stroke-dark" d="M 180 340 C 185 365 210 370 225 350" fill="none" stroke="#ff007f" stroke-width="6" />
  </g>

  <!-- LAYER 3: CYAN / SKY BLUE HTV (Eye Stalks, Alternating Spiral & Tail Swirl) -->
  <g id="Layer_3_Cyan_Vinyl" class="layer-cyan">
    <!-- Left Eye Stalk Antenna -->
    <path class="stroke-dark" d="M 230 275 C 220 220 200 170 190 140 L 215 135 C 225 165 245 220 250 275 Z" />
    <circle cx="195" cy="125" r="28" class="stroke-dark" />

    <!-- Right Eye Stalk Antenna -->
    <path class="stroke-dark" d="M 270 275 C 275 220 285 170 295 140 L 320 145 C 310 175 295 220 290 275 Z" />
    <circle cx="310" cy="130" r="28" class="stroke-dark" />

    <!-- Shell Outer Edge Rim Accent -->
    <circle cx="470" cy="310" r="195" fill="none" stroke="#48cae4" stroke-width="12" class="stroke-dark" />

    <!-- Shell Center Core Hub -->
    <circle cx="470" cy="310" r="26" class="stroke-dark" />
  </g>

  <!-- LAYER 4: CRISP WHITE HTV (Big Cartoon Eyes, Smile, & Light Bulb Dots) -->
  <g id="Layer_4_White_Vinyl" class="layer-white">
    <!-- Left Eye Pupil & Iris -->
    <circle cx="195" cy="125" r="20" />
    <circle cx="190" cy="123" r="10" fill="#111111" />
    <circle cx="187" cy="120" r="4" fill="#ffffff" />

    <!-- Right Eye Pupil & Iris -->
    <circle cx="310" cy="130" r="20" />
    <circle cx="305" cy="128" r="10" fill="#111111" />
    <circle cx="302" cy="125" r="4" fill="#ffffff" />

    <!-- Big Happy Open Smile -->
    <path class="stroke-dark" d="M 175 330 C 190 375 240 370 255 335 C 235 345 195 345 175 330 Z" />

    <!-- Shell Light Bulb Nodes (Arranged along the spiral curve for LEDs!) -->
    <circle cx="470" cy="310" r="9" />
    <circle cx="505" cy="310" r="8" />
    <circle cx="470" cy="350" r="8" />
    <circle cx="430" cy="310" r="8" />
    <circle cx="470" cy="250" r="8" />
    <circle cx="545" cy="310" r="8" />
    <circle cx="470" cy="390" r="8" />
    <circle cx="380" cy="310" r="8" />
    <circle cx="470" cy="205" r="8" />
    <circle cx="600" cy="310" r="8" />
    <circle cx="560" cy="415" r="8" />
    <circle cx="470" cy="450" r="8" />
    <circle cx="340" cy="370" r="8" />
    <circle cx="340" cy="250" r="8" />
    <circle cx="470" cy="155" r="8" />
    <circle cx="615" cy="210" r="8" />
    <circle cx="645" cy="310" r="8" />
    <circle cx="615" cy="415" r="8" />

    <!-- Snail Body Underside Glow Bulbs -->
    <circle cx="160" cy="510" r="7" />
    <circle cx="210" cy="510" r="7" />
    <circle cx="260" cy="510" r="7" />
    <circle cx="640" cy="510" r="7" />
  </g>
</svg>
