<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Main Street Electrical Parade - Float 01: Casey Jr. Locomotive -->
  <!-- Designed for Layered Cricut Heat Transfer Vinyl (HTV) Cutting -->
  
  <defs>
    <style>
      .layer-red { fill: #e63946; }
      .layer-gold { fill: #ffb703; }
      .layer-cyan { fill: #48cae4; }
      .layer-white { fill: #ffffff; }
      .stroke-dark { stroke: #111111; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- LAYER 1: RED HTV (Main Locomotive Body & Cab) -->
  <g id="Layer_1_Red_Vinyl" class="layer-red">
    <!-- Engineer Cab -->
    <path class="stroke-dark" d="M 480 200 L 660 200 L 660 440 L 480 440 Z" />
    <!-- Boiler Body -->
    <path class="stroke-dark" d="M 240 260 L 480 260 L 480 440 L 240 440 C 210 440 190 410 190 350 C 190 290 210 260 240 260 Z" />
    <!-- Smokestack Base -->
    <path class="stroke-dark" d="M 230 260 L 290 260 L 305 160 L 215 160 Z" />
    <!-- Cowcatcher / Pilot Base -->
    <path class="stroke-dark" d="M 120 450 L 240 420 L 240 465 L 110 465 Z" />
    <!-- Cab Window Silhouette Cutout Underlay -->
    <path class="stroke-dark" d="M 520 240 C 520 220 540 220 560 220 C 580 220 600 220 600 240 L 600 320 L 520 320 Z" />
  </g>

  <!-- LAYER 2: CYAN / BLUE HTV (Roof, Dome & Accents) -->
  <g id="Layer_2_Cyan_Vinyl" class="layer-cyan">
    <!-- Cab Curved Overhang Roof -->
    <path class="stroke-dark" d="M 460 200 C 460 180 520 170 570 170 C 620 170 680 180 680 200 L 670 215 L 470 215 Z" />
    <!-- Sand Dome on Boiler -->
    <path class="stroke-dark" d="M 370 260 C 370 220 430 220 430 260 Z" />
    <!-- Smokestack Crown Flare -->
    <path class="stroke-dark" d="M 200 160 C 200 145 320 145 320 160 L 305 175 L 215 175 Z" />
    <!-- Center Wheel Hubs -->
    <circle cx="560" cy="450" r="28" class="stroke-dark" />
    <circle cx="410" cy="465" r="22" class="stroke-dark" />
    <circle cx="280" cy="465" r="22" class="stroke-dark" />
  </g>

  <!-- LAYER 3: GOLD HTV (Trim, Wheels, Cowcatcher Grille, Bell) -->
  <g id="Layer_3_Gold_Vinyl" class="layer-gold">
    <!-- Brass Steam Bell -->
    <path class="stroke-dark" d="M 330 240 C 330 225 355 225 355 240 L 360 255 L 325 255 Z" />
    <!-- Boiler Brass Bands -->
    <rect x="315" y="260" width="14" height="180" rx="4" class="stroke-dark" />
    <rect x="440" y="260" width="14" height="180" rx="4" class="stroke-dark" />
    <!-- Cowcatcher Wedge Grille Bars -->
    <path class="stroke-dark" d="M 125 455 L 235 425 L 235 435 L 140 460 Z" />
    <path class="stroke-dark" d="M 145 460 L 235 440 L 235 450 L 165 465 Z" />
    <!-- Massive Rear Drive Wheel (Casey's signature large driver) -->
    <circle cx="560" cy="450" r="75" fill="none" stroke="#ffb703" stroke-width="16" />
    <circle cx="560" cy="450" r="75" fill="none" stroke="#111111" stroke-width="3" />
    <!-- Wheel Spokes (Drive Wheel) -->
    <line x1="560" y1="375" x2="560" y2="525" stroke="#ffb703" stroke-width="10" />
    <line x1="485" y1="450" x2="635" y2="450" stroke="#ffb703" stroke-width="10" />
    <line x1="507" y1="397" x2="613" y2="503" stroke="#ffb703" stroke-width="10" />
    <line x1="507" y1="503" x2="613" y2="397" stroke="#ffb703" stroke-width="10" />
    <!-- Front Small Wheels -->
    <circle cx="410" cy="465" r="48" fill="none" stroke="#ffb703" stroke-width="12" />
    <circle cx="410" cy="465" r="48" fill="none" stroke="#111111" stroke-width="3" />
    <circle cx="280" cy="465" r="48" fill="none" stroke="#ffb703" stroke-width="12" />
    <circle cx="280" cy="465" r="48" fill="none" stroke="#111111" stroke-width="3" />
    <!-- Heavy Side Piston Rod -->
    <rect x="280" y="455" width="230" height="16" rx="6" class="stroke-dark" />
    <!-- Headlight Bracket & Ring -->
    <path class="stroke-dark" d="M 160 300 L 200 300 L 200 380 L 160 380 Z" />
    <path class="stroke-dark" d="M 130 290 L 160 300 L 160 380 L 130 390 Z" />
  </g>

  <!-- LAYER 4: CRISP WHITE HTV (Headlight Beam, Steam Clouds, Whimsical Eyes) -->
  <g id="Layer_4_White_Vinyl" class="layer-white">
    <!-- Big Glowing Headlight Lens -->
    <ellipse cx="130" cy="340" rx="20" ry="42" class="stroke-dark" />
    <!-- Headlight Star Burst Highlight -->
    <polygon points="130,315 135,335 155,340 135,345 130,365 125,345 105,340 125,335" fill="#fffae0" />
    <!-- Puffy Steam Cloud 1 -->
    <path class="stroke-dark" d="M 230 130 C 210 130 200 110 215 90 C 210 70 235 55 255 65 C 275 45 310 50 320 75 C 340 75 350 95 335 115 C 345 130 330 145 310 140 C 290 150 260 145 250 130 Z" />
    <!-- Puffy Steam Cloud 2 (smaller leading puff) -->
    <path class="stroke-dark" d="M 330 70 C 320 70 315 55 325 45 C 320 30 340 20 355 28 C 370 15 395 20 400 38 C 415 38 420 52 410 65 C 418 75 405 85 390 82 C 375 90 350 85 345 75 Z" />
    <!-- Whimsical Engine Number "1" on Cab -->
    <text x="635" y="325" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="bold" text-anchor="middle" fill="#ffffff" stroke="#111111" stroke-width="2">1</text>
  </g>
</svg>
